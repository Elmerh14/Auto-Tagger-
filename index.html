<!DOCTYPE html>
<html>
<head>
    <title>AutoTagger - Vehicle Parts NER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">AutoTagger — Vehicle Listing Analyzer</h1>

        <form method="POST" class="card p-4 shadow-sm">
            <label class="form-label">Enter Product Title:</label>
            <input type="text" class="form-control mb-3" name="listing" placeholder="2015 Toyota Camry brake pads OEM">

            <button class="btn btn-primary w-100" type="submit">Analyze Listing</button>
        </form>

        {% if result %}
        <div class="card mt-4 p-4 shadow-sm">
            <h4>Extracted Information</h4>
            <ul>
                <li><strong>Make:</strong> {{ result.MAKE }}</li>
                <li><strong>Model:</strong> {{ result.MODEL }}</li>
                <li><strong>Year:</strong> {{ result.YEAR }}</li>
                <li><strong>Part:</strong> {{ result.PART }}</li>
                <li><strong>Brand:</strong> {{ result.BRAND }}</li>
            </ul>
        </div>
        {% endif %}

    </div>
</body>
</html>
